---
bastionvault::registry: 'docker.io'
bastionvault::image_account: ''
bastionvault::image_name: 'bastionvault'
bastionvault::image_tag: '0.3.2'

bastionvault::listen_port: 4200
bastionvault::container_port: 8200
bastionvault::listen_address: '0.0.0.0'
bastionvault::tls_disable: false

bastionvault::data_dir: '/srv/application-data/bastionvault'
bastionvault::config_dir: '/srv/application-config/bastionvault'
bastionvault::tls_dir: '/srv/application-config/bastionvault/tls'
bastionvault::log_dir: '/srv/application-logs/bastionvault'

bastionvault::user: 'bastionvault'
bastionvault::group: 'bastionvault'

bastionvault::memory_max: '2G'
bastionvault::cpu_quota: '200%'
bastionvault::tasks_max: 4096
bastionvault::io_weight: 100

bastionvault::log_level: 'info'
bastionvault::log_to_stderr: true
bastionvault::log_rotate_size_mb: 0
bastionvault::log_rotate_keep: 0

bastionvault::mode: 'single'
bastionvault::node_id: 1
bastionvault::raft_listen_addr: '0.0.0.0'
bastionvault::raft_port: 8210
bastionvault::internal_api_port: 8220

bastionvault::cluster_tls_raft_disable: false
bastionvault::cluster_tls_api_disable: false
bastionvault::cluster_tls_raft_no_verify: false
bastionvault::cluster_tls_api_no_verify: false

bastionvault::pid_file: '/var/run/bvault.pid'

# In-container, exec-allowed staging dir for process-plugin binaries. Keeps
# plugins working when /tmp is mounted noexec. Set to ~ to use the server's
# OS-temp-dir default; override to a writable exec mount under read-only rootfs.
bastionvault::plugin_runtime_dir: '/var/lib/bvault/plugin-run'

# ── HSM auto-unseal ──────────────────────────────────────────────────────────
# Leave $hsm_backend unset (~) to stay on Shamir unseal (default). Set to 'mock'
# (dev/homolog; image must be built with the hsm_mock feature) or 'yubihsm2'.
bastionvault::hsm_backend: ~
bastionvault::hsm_recovery: 'none'
bastionvault::hsm_mock_state_path: '/var/lib/bvault/data/mock-hsm.json'
# HA + mock example (each node needs the SAME node_id and the SAME pinned
# device material — provision once, distribute the JSON via eyaml):
#   bastionvault::hsm_backend: 'mock'
#   bastionvault::hsm_node_id: 'hml'
#   bastionvault::hsm_mock_state_base64: >
#     ENC[eyaml...base64 of mock-hsm.json...]
# YubiHSM 2 example:
#   bastionvault::hsm_backend: 'yubihsm2'
#   bastionvault::hsm_connector: 'http://127.0.0.1:12345'
#   bastionvault::hsm_password: >
#     ENC[PKCS7,...]

bastionvault::manage_selinux: true
bastionvault::manage_firewall: false

bastionvault::mount_host_ca_bundle: true
# Leave unset to auto-detect (/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem).
# bastionvault::host_ca_bundle_path: '/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem'
